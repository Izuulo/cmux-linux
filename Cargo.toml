[workspace]
resolver = "3"
members = ["crates/*", "vendor/ghostty-vt", "vendor/ghostty-vt-sys"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
[workspace.lints.clippy]

[workspace.dependencies]
base64 = "0.22"
png = "0.17"
bindgen = "0.72"
ghostty-vt-sys = { path = "vendor/ghostty-vt-sys" }
ghostty-vt = { path = "vendor/ghostty-vt" }
gpui = "=0.2.2"
