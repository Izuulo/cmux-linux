[workspace]
resolver = "3"
members = ["crates/*", "vendor/ghostty-vt", "vendor/ghostty-vt-sys"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
[workspace.lints.clippy]

[workspace.dependencies]
base64 = "0.22"
serde_json = "1"
# Already in Cargo.lock through gpui, with v4 enabled.
uuid = { version = "1", features = ["v4"] }
png = "0.17"
bindgen = "0.72"
ghostty-vt-sys = { path = "vendor/ghostty-vt-sys" }
ghostty-vt = { path = "vendor/ghostty-vt" }
cmux-term = { path = "crates/cmux-term" }
cmux-config = { path = "crates/cmux-config" }
cmux-core = { path = "crates/cmux-core" }
cmux-meta = { path = "crates/cmux-meta" }
cmux-ipc = { path = "crates/cmux-ipc" }
gpui = "=0.2.2"
portable-pty = "0.9"
libc = "0.2"
futures = "0.3"
# In-app browser (M13, feature `browser` on cmux-app): CEF off-screen rendering. `build-util`
# (clap, cargo_metadata) is only for macOS app bundling.
cef = { version = "=156.4.0", default-features = false }
# Already in Cargo.lock via gpui: CEF frames become gpui `RenderImage`s.
image = { version = "0.25", default-features = false }
smallvec = "1"
# Already in Cargo.lock (cbindgen); `parse` only, no serde derive.
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
# Already in Cargo.lock via toml; comment-preserving config.toml writes (M12).
toml_edit = { version = "0.22.27", default-features = false, features = ["parse", "display"] }
# Blur shim (Linux). All already in Cargo.lock via gpui/ashpd; wayland-client/backend match gpui's.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
raw-window-handle = "0.6"
