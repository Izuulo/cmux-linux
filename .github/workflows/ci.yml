name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: STATUS.md line limit
        run: scripts/check-status-lines.sh
      - name: UI look only from the mac kit (M14)
        run: scripts/check-mac-tokens.sh
      - name: System libraries (gpui, bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev \
            libssl-dev libzstd-dev
      # Must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Zig 0.16.0
        # Ghostty's build.zig runs a bare `zig env`, so zig must be on PATH (ZIG alone isn't enough).
        run: |
          scripts/install-zig.sh
          echo "$PWD/.tools/zig" >> "$GITHUB_PATH"
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses
      - name: Format (our crates; vendored code is left as upstream wrote it)
        run: cargo fmt --check -p cmux-app -p cmux-config -p cmux-core -p cmux-ipc -p cmux-meta -p cmux-term
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # Vendored ghostty-vt fails clippy::chunks_exact_to_as_chunks on 1.99 (kitty.rs); we don't lint vendored code.
      - run: cargo clippy --workspace --all-targets --locked --no-deps --exclude ghostty-vt --exclude ghostty-vt-sys -- -D warnings

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Zig 0.16.0
        run: |
          scripts/install-zig.sh
          echo "$PWD/.tools/zig" >> "$GITHUB_PATH"
      # Release: a debug gpui app build hangs in Application::new.
      - run: cargo build --workspace --locked --release --features gpui/runtime_shaders
      - run: cargo test --workspace --locked --release --features gpui/runtime_shaders

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm git rustup clang namcap desktop-file-utils sudo \
            fontconfig freetype2 libxkbcommon libxkbcommon-x11 wayland vulkan-icd-loader \
            libx11 libxcb
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build the package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/repo
          chown -R builder /home/builder/repo
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder rustup default 1.99.0
          sudo -u builder bash -c 'cd /home/builder/repo/packaging/arch &&
            _repo="file:///home/builder/repo" makepkg -s --noconfirm'
      - name: Check the package
        run: |
          cd /home/builder/repo/packaging/arch
          namcap *.pkg.tar.zst
          pacman -Qlp *.pkg.tar.zst | tee files
          grep -q ' /usr/lib/cmux-linux/cmux$' files
          grep -q ' /usr/bin/cmux-linux$' files
          desktop-file-validate /home/builder/repo/packaging/cmux-linux.desktop
