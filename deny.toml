# Licence gate (CI: cargo deny check licenses). Only licences compatible with
# GPL-3.0-or-later; "A OR B" expressions pass if one side is listed.
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # libbz2-rs-sys and webpki-roots: build-time only, CEF's downloader (feature `browser`).
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
