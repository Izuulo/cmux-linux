[package]
name = "cmux-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cmux-term.workspace = true
cmux-config.workspace = true
cmux-core.workspace = true
cmux-meta.workspace = true
cmux-ipc.workspace = true
serde_json.workspace = true
gpui.workspace = true
futures.workspace = true
libc.workspace = true
cef = { workspace = true, optional = true }
image = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }

[features]
# The in-app browser (M13): links libcef.so, which `scripts/install-cef.sh` fetches.
browser = ["dep:cef", "dep:image", "dep:smallvec"]

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client.workspace = true
wayland-backend.workspace = true
wayland-protocols.workspace = true
raw-window-handle.workspace = true
# Desktop notifications over D-Bus (already in the tree through gpui's ashpd).
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
