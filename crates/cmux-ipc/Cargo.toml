[package]
name = "cmux-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "cmux"
path = "src/bin/cmux.rs"

[dependencies]
cmux-core = { path = "../cmux-core" }
# Keeps key order of users' settings.json even in a standalone `-p cmux-ipc` build.
serde_json = { workspace = true, features = ["preserve_order"] }
uuid.workspace = true
libc.workspace = true
futures.workspace = true
